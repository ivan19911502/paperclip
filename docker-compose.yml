services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportpulse}
      POSTGRES_USER: ${POSTGRES_USER:-sportpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sportpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportpulse} -d ${POSTGRES_DB:-sportpulse}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [sportpulse-internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sportpulse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sportpulse}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sportpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "${SPORTPULSE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks: [sportpulse-internal]

networks:
  sportpulse-internal:
    driver: bridge

volumes:
  sportpulse-postgres:
